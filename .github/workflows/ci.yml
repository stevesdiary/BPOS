name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
    branches: [master]

jobs:
  check:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bpos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bpos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      NODE_ENV: test
      # Must match the DATABASE_URL that vitest.config.ts sets for tests: the
      # health check and any unmocked query resolve against this Postgres
      # service. The app's DB client speaks the wire protocol to it via the
      # postgres-js driver (Neon HTTP is used only for real Neon hosts).
      DATABASE_URL: postgresql://test:test@localhost:5432/bpos_test
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long
      REDIS_URL: redis://localhost:6379
      R2_ACCOUNT_ID: test
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET_NAME: test
      R2_PUBLIC_URL: http://localhost:9000
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_placeholder
      TERMII_API_KEY: test
      PLATFORM_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
