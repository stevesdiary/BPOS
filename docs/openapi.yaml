        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── WhatsApp ───────────────────────────────────────────────────────────────
  /v1/whatsapp/webhook:
    get:
      tags: [WhatsApp]
      summary: Meta webhook verification
      security: []
      description: |
        Meta webhook verification endpoint. Returns the challenge value if verify_token matches.
        Used during webhook setup in Meta Business Suite.
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
          description: Must match WHATSAPP_VERIFY_TOKEN env var
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the challenge value
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Invalid verify token

    post:
      tags: [WhatsApp]
      summary: Receive WhatsApp events from Meta
      security: []
      description: |
        Inbound WhatsApp message receiver. Processes messages through the session state machine:
        idle → browsing → cart → checkout → awaiting_payment → complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Meta WhatsApp webhook event payload
      responses:
        '200':
          description: Event received

  /v1/whatsapp/setup:
    post:
      tags: [WhatsApp]
      summary: Register a WhatsApp phone number ID
      description: Associates a Meta WhatsApp Business phone number with this tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSetupBody'
      responses:
        '200':
          description: WhatsApp configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ─── Onboarding ─────────────────────────────────────────────────────────────
  /v1/onboarding:
    get:
      tags: [Onboarding]
      summary: Get guided setup checklist
      description: Returns the guided setup checklist showing completed and pending steps for this merchant.
      responses:
        '200':
          description: Onboarding checklist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OnboardingChecklist'

  # ─── Dispatch ───────────────────────────────────────────────────────────────
  /v1/dispatch/configure:
    post:
      tags: [Dispatch]
      summary: Configure logistics provider
      description: Configures logistics provider for this tenant. Credentials are AES-256 encrypted at rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchConfigureBody'
      responses:
        '200':
          description: Logistics configured
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DispatchConfig'

  /v1/dispatch/config:
    get:
      tags: [Dispatch]
      summary: Get current logistics configuration
      responses:
        '200':
          description: Logistics config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DispatchConfig'

  /v1/dispatch/quote:
    post:
      tags: [Dispatch]
      summary: Get a shipping fee quote
      description: Gets a live shipping quote from the configured logistics provider before dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchQuoteBody'
      responses:
        '200':
          description: Shipping quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchQuoteResponse'

  /v1/dispatch/{orderId}/dispatch:
    post:
      tags: [Dispatch]
      summary: Dispatch an order
      description: |
        Dispatches an order via the configured logistics provider.
        Merchant-triggered (not automatic on payment).
        Order status automatically updates to "In Transit" when provider confirms pick-up.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        '200':
          description: Order dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          trackingNumber:
                            type: string
                          status:
                            type: string

  /v1/dispatch/{orderId}/track:
    get:
      tags: [Dispatch]
      summary: Get live tracking status
      description: Returns current tracking status from the logistics provider.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        '200':
          description: Tracking status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                          location:
                            type: string
                            nullable: true
                          estimatedDelivery:
                            type: string
                            format: date-time
                            nullable: true
                          events:
                            type: array
                            items:
                              type: object
                              properties:
                                timestamp:
                                  type: string
                                  format: date-time
                                status:
                                  type: string
                                location:
                                  type: string

  /v1/dispatch/webhook/{provider}/{tenantId}:
    post:
      tags: [Dispatch]
      summary: Inbound webhook from logistics provider
      security: []
      description: Receives tracking updates from logistics providers (TRAKA, generic).
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [traka, generic]
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
          description: Tenant UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific webhook payload
      responses:
        '200':
          description: Webhook received

  # ─── Uploads ────────────────────────────────────────────────────────────────
  /v1/uploads/image:
    post:
      tags: [Uploads]
      summary: Upload and compress an image
      description: |
        Upload and compress an image (product photo, expense receipt, etc.).
        Server-side compression via Sharp before storing in Cloudflare R2.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP)
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  # ─── Shipping ───────────────────────────────────────────────────────────────
  /v1/shipping/states:
    get:
      tags: [Shipping]
      summary: List Nigerian states
      description: Returns valid Nigerian state names for zone/rate configuration.
      responses:
        '200':
          description: Nigerian states
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                        description: List of 36 Nigerian states + FCT

  /v1/shipping/zones:
    post:
      tags: [Shipping]
      summary: Create a shipping zone
      description: Creates a named group of Nigerian states. Use for zone-based shipping rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingZoneCreateBody'
      responses:
        '201':
          description: Zone created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShippingZone'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Shipping]
      summary: List shipping zones
      responses:
        '200':
          description: Zone list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShippingZone'

  /v1/shipping/zones/{id}:
    patch:
      tags: [Shipping]
      summary: Update a shipping zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zone ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingZoneCreateBody'
      responses:
        '200':
          description: Zone updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShippingZone'

    delete:
      tags: [Shipping]
      summary: Delete a shipping zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zone ID
      responses:
        '200':
          description: Zone deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/shipping/methods:
    post:
      tags: [Shipping]
      summary: Create a shipping method
      description: |
        Creates a shipping method. Types:
        - flat_rate: Fixed fee for all orders
        - zone_rate: Different fees per shipping zone
        - value_rate: Fees based on order value
        - weight_rate: Fees based on package weight
        - automated: Live quote from logistics provider
        - free: Free shipping with optional conditions
        - pick_up: Customer collects from a pickup location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingMethodCreateBody'
      responses:
        '201':
          description: Method created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShippingMethod'

    get:
      tags: [Shipping]
      summary: List all shipping methods
      responses:
        '200':
          description: Method list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShippingMethod'

  /v1/shipping/methods/{id}:
    patch:
      tags: [Shipping]
      summary: Update a shipping method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingMethodCreateBody'
      responses:
        '200':
          description: Method updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShippingMethod'

  /v1/shipping/methods/{id}/rates:
    post:
      tags: [Shipping]
      summary: Add a rate row to a shipping method
      description: Used for zone_rate, value_rate, and weight_rate methods.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingRateCreateBody'
      responses:
        '201':
          description: Rate added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShippingRate'

    get:
      tags: [Shipping]
      summary: List rate rows for a shipping method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
      responses:
        '200':
          description: Rate list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShippingRate'

  /v1/shipping/methods/{id}/rates/{rateId}:
    delete:
      tags: [Shipping]
      summary: Remove a rate row from a shipping method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
        - name: rateId
          in: path
          required: true
          schema:
            type: string
          description: Rate ID
      responses:
        '200':
          description: Rate removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/shipping/methods/{id}/conditions:
    post:
      tags: [Shipping]
      summary: Add a condition to a free shipping method
      description: |
        Condition types:
        - always: Free for all orders
        - min_order_value: Free when order exceeds minimum
        - product: Free for specific product
        - category: Free for products in category
        - promo_code: Free when promo code applied
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeShippingConditionCreateBody'
      responses:
        '201':
          description: Condition added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FreeShippingCondition'

    get:
      tags: [Shipping]
      summary: List conditions for a free shipping method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
      responses:
        '200':
          description: Condition list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FreeShippingCondition'

  /v1/shipping/methods/{id}/conditions/{conditionId}:
    delete:
      tags: [Shipping]
      summary: Remove a condition from a free shipping method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Method ID
        - name: conditionId
          in: path
          required: true
          schema:
            type: string
          description: Condition ID
      responses:
        '200':
          description: Condition removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/shipping/pickup-locations:
    post:
      tags: [Shipping]
      summary: Create a pickup location
      description: |
        Creates a pickup location. Types:
        - branch: Merchant's own location (references locations table)
        - third_party: External collection point (GIG, DHL, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupLocationCreateBody'
      responses:
        '201':
          description: Pickup location created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PickupLocation'

    get:
      tags: [Shipping]
      summary: List active pickup locations
      description: Semi-public endpoint (works without auth, returns empty data if no tenant).
      security: []
      responses:
        '200':
          description: Pickup location list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PickupLocation'

  /v1/shipping/pickup-locations/{id}:
    patch:
      tags: [Shipping]
      summary: Update a pickup location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Pickup location ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupLocationCreateBody'
      responses:
        '200':
          description: Pickup location updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PickupLocation'

  /v1/shipping/available:
    get:
      tags: [Shipping]
      summary: Get available shipping methods and fees
      description: |
        Returns all applicable shipping methods with fees for a given checkout context, sorted cheapest first.
        Semi-public endpoint (works without auth, returns empty data if no tenant).
      security: []
      parameters:
        - name: cartTotal
          in: query
          required: true
          schema:
            type: string
          description: Cart total in kobo
        - name: destinationState
          in: query
          required: true
          schema:
            type: string
          description: Destination Nigerian state
        - name: weightKg
          in: query
          schema:
            type: string
          description: Total weight in kg (for weight-based methods)
      responses:
        '200':
          description: Available shipping methods
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AvailableShippingMethod'
                        description: Sorted by fee (cheapest first)

  # ─── Parameters ─────────────────────────────────────────────────────────────
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: string
        default: '1'
        pattern: '^[1-9]\d*$'
      description: Page number (1-indexed)

    Limit:
      name: limit
      in: query
      schema:
        type: string
        default: '20'
        pattern: '^[1-9]\d*$'
      description: Items per page

    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Product ID

  # ─── Schemas (reusable) ────────────────────────────────────────────────────
  # Pagination schema used in list responses
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total items matching query
        totalPages:
          type: integer
          description: Total number of pages
