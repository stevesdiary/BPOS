        - schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          in: query
          name: to
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/reports/staff-sales/export:
    get:
      summary: Export staff sales report as CSV
      tags:
        - Reporting
      parameters:
        - schema:
            type: string
          in: query
          name: from
          required: false
        - schema:
            type: string
          in: query
          name: to
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/reports/inventory-valuation:
    get:
      summary: Inventory valuation (quantity × cost per variant per location)
      tags:
        - Reporting
      description: Gated to manager+ via reporting:margin feature flag. Cost data is
        sensitive.
      parameters:
        - schema:
            default: json
            type: string
            enum:
              - json
              - csv
          in: query
          name: format
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/invoices/:
    post:
      summary: Generate an invoice for an order
      tags:
        - Invoicing
      description: Creates an invoice record and enqueues async PDF generation. Poll
        GET /invoices/:id to check when pdfUrl is populated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
              required:
                - orderId
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List invoices
      tags:
        - Invoicing
      parameters:
        - schema:
            type: string
          in: query
          name: orderId
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/invoices/{id}:
    get:
      summary: Get an invoice (with order details and line items)
      tags:
        - Invoicing
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/whatsapp/webhook:
    get:
      summary: Meta webhook verification endpoint
      tags:
        - WhatsApp
      description: Responds to Meta hub challenge. Set WHATSAPP_VERIFY_TOKEN in env.
      parameters:
        - schema:
            type: string
          in: query
          name: hub.mode
          required: true
        - schema:
            type: string
          in: query
          name: hub.verify_token
          required: true
        - schema:
            type: string
          in: query
          name: hub.challenge
          required: true
      responses:
        "200":
          description: Default Response
    post:
      summary: Receive WhatsApp events from Meta
      tags:
        - WhatsApp
      description: Validates x-hub-signature-256 and processes inbound messages.
      responses:
        "200":
          description: Default Response
  /v1/whatsapp/setup:
    post:
      summary: Register a WhatsApp phone number ID for this tenant
      tags:
        - WhatsApp
      description: Maps a Meta phone_number_id to this tenant so inbound messages are
        routed correctly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumberId:
                  type: string
              required:
                - phoneNumberId
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/onboarding/:
    get:
      summary: Get guided setup checklist for this merchant
      tags:
        - Onboarding
      description: Returns which onboarding steps are complete and which are pending.
        Poll this endpoint to drive a guided first-time setup UI.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/dispatch/configure:
    post:
      summary: Configure logistics provider for this tenant
      tags:
        - Dispatch
      description: "Store encrypted API key + webhook secret for a logistics provider
        (e.g. traka). For TRAKA: the merchant must first register on TRAKA, get
        approved, and create an API key. BPOS stores the key encrypted — it is
        never returned in plaintext."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - traka
                    - sendstack
                    - gig
                    - dhl
                    - kwik
                    - generic
                apiKey:
                  type: string
                  minLength: 10
                webhookSecret:
                  type: string
                  minLength: 8
                baseUrl:
                  type: string
              required:
                - provider
                - apiKey
                - webhookSecret
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /v1/dispatch/config:
    get:
      summary: Get current logistics provider configuration
      tags:
        - Dispatch
      responses:
        "200":
          description: Default Response
  /v1/dispatch/quote:
    post:
      summary: Get a shipping fee quote
      tags:
        - Dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupAddress:
                  type: string
                deliveryAddress:
                  type: string
                weightKg:
                  type: number
                  minimum: 0.1
              required:
                - pickupAddress
                - deliveryAddress
                - weightKg
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /v1/dispatch/{orderId}/dispatch:
    post:
      summary: Dispatch an order via the configured logistics provider
      tags:
        - Dispatch
      description: Order must be in PROCESSING status and have a deliveryAddress set.
        On success the order transitions to DISPATCHED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupAddress:
                  type: string
                recipientName:
                  type: string
                recipientPhone:
                  type: string
                weightKg:
                  type: number
                  minimum: 0.1
              required:
                - pickupAddress
                - recipientName
                - recipientPhone
                - weightKg
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: orderId
          required: true
      responses:
        "200":
          description: Default Response
  /v1/dispatch/{orderId}/track:
    get:
      summary: Get live tracking status for a dispatched order
      tags:
        - Dispatch
      parameters:
        - schema:
            type: string
          in: path
          name: orderId
          required: true
      responses:
        "200":
          description: Default Response
  /v1/uploads/image:
    post:
      summary: Upload and compress an image (product photo, expense receipt, etc.)
      tags:
        - Uploads
      description: Accepts a single multipart image file (jpeg/png/webp), compresses
        it, and returns a public URL to attach to other resources (e.g.
        imageUrl, receiptUrl).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/states:
    get:
      summary: List valid Nigerian state names for zone/rate configuration
      tags:
        - Shipping
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/zones:
    post:
      summary: Create a shipping zone (named group of Nigerian states)
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                states:
                  minItems: 1
                  type: array
                  items:
                    type: string
              required:
                - name
                - states
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List shipping zones
      tags:
        - Shipping
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/zones/{id}:
    patch:
      summary: Update a shipping zone
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                states:
                  type: array
                  items:
                    type: string
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    delete:
      summary: Delete a shipping zone
      tags:
        - Shipping
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods:
    post:
      summary: Create a shipping method
      tags:
        - Shipping
      description: "type values: flat_rate | zone_rate | value_rate | weight_rate |
        automated | free | pick_up. flat_rate requires flatRateKobo. free with
        isFreeAlways=true is always visible at checkout. free without
        isFreeAlways uses conditions (POST /shipping/methods/:id/conditions).
        zone_rate / value_rate / weight_rate require rates (POST
        /shipping/methods/:id/rates). automated uses the configured logistics
        provider for a live quote. pick_up always returns NGN 0 — customer must
        also choose a pick-up location."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - flat_rate
                    - zone_rate
                    - value_rate
                    - weight_rate
                    - automated
                    - free
                    - pick_up
                description:
                  type: string
                estimatedDaysMin:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                estimatedDaysMax:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                flatRateKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                isFreeAlways:
                  type: boolean
                merchantCostKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - name
                - type
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List all shipping methods
      tags:
        - Shipping
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods/{id}:
    patch:
      summary: Update a shipping method
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                estimatedDaysMin:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                estimatedDaysMax:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                flatRateKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                isFreeAlways:
                  type: boolean
                merchantCostKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                isActive:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods/{id}/rates:
    post:
      summary: Add a rate row to a zone_rate / value_rate / weight_rate method
      tags:
        - Shipping
      description: 'For zone_rate: set zoneId (or omit for catch-all). For value_rate:
        set min/maxOrderValueKobo. For weight_rate: set min/maxWeightKg.
        maxOrderValueKobo / maxWeightKg can be omitted for "and above" tiers.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feeKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                zoneId:
                  type: string
                minOrderValueKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                maxOrderValueKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                minWeightKg:
                  type: number
                  minimum: 0
                maxWeightKg:
                  type: number
                  minimum: 0
              required:
                - feeKobo
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List rate rows for a shipping method
      tags:
        - Shipping
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods/{id}/rates/{rateId}:
    delete:
      summary: Remove a rate row from a shipping method
      tags:
        - Shipping
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: path
          name: rateId
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods/{id}/conditions:
    post:
      summary: Add a condition to a free shipping method
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conditionType:
                  type: string
                  enum:
                    - always
                    - min_order_value
                    - product
                    - category
                    - promo_code
                thresholdKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                productId:
                  type: string
                categoryId:
                  type: string
                promoCode:
                  type: string
              required:
                - conditionType
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List conditions for a free shipping method
      tags:
        - Shipping
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/methods/{id}/conditions/{conditionId}:
    delete:
      summary: Remove a condition from a free shipping method
      tags:
        - Shipping
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: path
          name: conditionId
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/pickup-locations:
    post:
      summary: Create a pick-up location (merchant branch or third-party collection
        point)
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                locationType:
                  type: string
                  enum:
                    - merchant_branch
                    - third_party
                locationId:
                  type: string
                providerName:
                  type: string
                address:
                  type: string
                state:
                  type: string
                phone:
                  type: string
                operatingHours:
                  type: string
              required:
                - name
                - locationType
                - address
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List active pick-up locations (public — no auth required)
      tags:
        - Shipping
      description: Called by the customer-facing storefront. Filter by Nigerian state
        with ?state=Lagos.
      parameters:
        - schema:
            type: string
          in: query
          name: state
          required: false
      responses:
        "200":
          description: Default Response
  /v1/shipping/pickup-locations/{id}:
    patch:
      summary: Update a pick-up location
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                state:
                  type: string
                phone:
                  type: string
                operatingHours:
                  type: string
                isActive:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/shipping/available:
    get:
      summary: Get available shipping methods and fees for a given checkout context
      tags:
        - Shipping
      description: Called at checkout after the customer provides their delivery
        details. Returns options sorted cheapest-first. automated methods are
        excluded — use GET /shipping/quote for live provider quotes.
      parameters:
        - schema:
            type: string
          in: query
          name: orderValueKobo
          required: true
        - schema:
            type: string
          in: query
          name: destinationState
          required: false
        - schema:
            type: string
          in: query
          name: totalWeightKg
          required: false
        - schema:
            type: string
          in: query
          name: promoCode
          required: false
        - schema:
            type: string
          in: query
          name: itemProductIds
          required: false
        - schema:
            type: string
          in: query
          name: itemCategoryIds
          required: false
      responses:
        "200":
          description: Default Response
  /v1/settings/audit:
    get:
      summary: Your business activity trail
      tags:
        - Settings
      description: Who did what in your business, including any access by BPOS support
        staff and the reason they gave. Filter with actorType=platform to see
        only BPOS staff access.
      parameters:
        - schema:
            type: string
            enum:
              - user
              - platform
              - system
          in: query
          name: actorType
          required: false
        - schema:
            type: string
            minLength: 1
          in: query
          name: action
          required: false
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
          in: query
          name: page
          required: false
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
