openapi: 3.0.3
info:
  title: BPOS API
  description: >-
    Multi-tenant commerce and operations platform for Nigerian SMEs.


    ## Authentication

    Each business is a tenant, identified by its handle (`slug`). A user account
    belongs to one tenant.


    1. `POST /v1/auth/login` with `{ tenantSlug, email, password }` returns
    `accessToken`, `refreshToken` and `user`.

    2. Send `Authorization: Bearer <accessToken>` on every protected request.
    The token carries the tenant, so no tenant header is needed.

    3. When a request returns `401`, call `POST /v1/auth/refresh` with `{
    tenantSlug, refreshToken }`. It returns a new `accessToken` only; the
    refresh token is reused until it expires (7 days) or is revoked.

    4. `POST /v1/auth/logout` with `{ refreshToken }` revokes it.


    Access tokens last 15 minutes by default (`JWT_ACCESS_EXPIRY`). Request
    bodies reject unknown keys and use camelCase.


    ## Responses

    Success: `{ "success": true, "data": ... }`


    Failure: `{ "success": false, "error": { "code", "message", "details"? } }`.
    Common codes: `VALIDATION_ERROR` (400, `details` lists the fields),
    `UNAUTHORIZED` (401), `FORBIDDEN` (403), `FEATURE_GATED` (402), `NOT_FOUND`
    (404), `CONFLICT` (409), `RATE_LIMIT_EXCEEDED` (429), `INTERNAL_ERROR`
    (500), `EXTERNAL_SERVICE_ERROR` (502, a payment or logistics provider
    failed).


    A path that does not exist returns Fastify's own shape instead: `{
    "message", "error", "statusCode" }`.


    ## Pagination

    Merchant list endpoints (orders, products, customers, inventory, expenses,
    ledger) take `page` and `limit` query parameters and return

    `data: { items, total, page, limit, totalPages }`.

    Platform (admin) list endpoints nest the counts instead: `data: { items,
    pagination: { page, limit, total, totalPages } }`.


    ## Money

    Amounts are integers in kobo (₦1 = 100 kobo).
  version: 1.0.0
  contact:
    name: BPOS Engineering
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /v1/auth/login:
    post:
      summary: Authenticate a user and receive tokens
      tags:
        - Auth
      description: "Accounts are scoped to a business: the same email under another
        `tenantSlug` is a different account. Wrong email, wrong password, or
        credentials from another business all return the same 401. An unknown
        `tenantSlug` returns 404. Rate limited: 10 requests per minute."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantSlug:
                  type: string
                  description: The business handle chosen at signup (tenant `slug`), e.g.
                    `fashion-hub`
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 8
              required:
                - tenantSlug
                - email
                - password
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: "JWT for `Authorization: Bearer`. Short-lived (JWT_ACCESS_EXPIRY,
                          15m by default)"
                      refreshToken:
                        type: string
                        description: Opaque token for /v1/auth/refresh and /v1/auth/logout. Valid 7
                          days; not rotated on refresh
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          email:
                            type: string
                          firstName:
                            type: string
                          lastName:
                            type: string
                          role:
                            type: string
                            enum:
                              - owner
                              - manager
                              - staff
                              - viewer
                        required:
                          - id
                          - email
                          - firstName
                          - lastName
                          - role
                        additionalProperties: false
                    required:
                      - accessToken
                      - refreshToken
                      - user
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new access token
      tags:
        - Auth
      description: "Call when an authenticated request returns 401. Returns only a new
        `accessToken`; keep using the same `refreshToken` until it expires (7
        days) or is revoked by logout. Rate limited: 20 requests per minute."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantSlug:
                  type: string
                  description: The business handle chosen at signup (tenant `slug`), e.g.
                    `fashion-hub`
                refreshToken:
                  type: string
                  description: Refresh token returned by /v1/auth/login
              required:
                - tenantSlug
                - refreshToken
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        description: New access token. The refresh token stays the same
                    required:
                      - accessToken
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/auth/logout:
    post:
      summary: Revoke a refresh token (logout)
      tags:
        - Auth
      description: After this, /v1/auth/refresh rejects the token with 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/auth/me:
    get:
      summary: Get the authenticated user profile
      tags:
        - Auth
      description: "Returns the claims in the access token, not the full profile: no
        name fields. Use the `user` object from login for display."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      tenantId:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum:
                          - owner
                          - manager
                          - staff
                          - viewer
                    required:
                      - userId
                      - tenantId
                      - email
                      - role
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      tags:
        - Auth
      description: Always returns success to prevent email enumeration. If the email
        exists, a reset link is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantSlug:
                  type: string
                  description: The business handle chosen at signup (tenant `slug`), e.g.
                    `fashion-hub`
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - tenantSlug
                - email
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/auth/reset-password:
    post:
      summary: Reset password using token from email
      tags:
        - Auth
      description: "Rate limited: 5 requests per 15 minutes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantSlug:
                  type: string
                  description: The business handle chosen at signup (tenant `slug`), e.g.
                    `fashion-hub`
                token:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
              required:
                - tenantSlug
                - token
                - newPassword
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/tenants/:
    post:
      summary: Provision a new merchant tenant (public signup)
      tags:
        - Tenants
      description: Creates an isolated tenant schema, seeds default data, and
        registers the owner account. Rate limited to 3 per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                slug:
                  type: string
                  minLength: 2
                  maxLength: 50
                  pattern: ^[a-z0-9-]+$
                  description: "Business handle: lowercase letters, numbers, hyphens. Users log in
                    with it as `tenantSlug`"
                businessEmail:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                businessPhone:
                  type: string
                ownerFirstName:
                  type: string
                  minLength: 1
                ownerLastName:
                  type: string
                  minLength: 1
                ownerPassword:
                  type: string
                  minLength: 8
              required:
                - name
                - slug
                - businessEmail
                - ownerFirstName
                - ownerLastName
                - ownerPassword
              additionalProperties: false
      security: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      tenantId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      slug:
                        type: string
                        description: Use as `tenantSlug` when logging in
                      message:
                        type: string
                    required:
                      - tenantId
                      - slug
                      - message
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - success
                  - error
                additionalProperties: false
  /v1/products/categories:
    post:
      summary: Create a product category
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                parentId:
                  type: string
              required:
                - name
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List all product categories
      tags:
        - Products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/products/:
    post:
      summary: Create a product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                categoryId:
                  type: string
                imageUrl:
                  type: string
              required:
                - name
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    get:
      summary: List products (paginated)
      tags:
        - Products
      parameters:
        - schema:
            type: string
          in: query
          name: page
          required: false
        - schema:
            type: string
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: query
          name: categoryId
          required: false
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: isActive
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/products/{id}:
    get:
      summary: Get a product with its variants
      tags:
        - Products
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
    patch:
      summary: Update a product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  nullable: true
                  type: string
                categoryId:
                  nullable: true
                  type: string
                imageUrl:
                  nullable: true
                  type: string
                isActive:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/products/{id}/variants:
    post:
      summary: Add a variant to a product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                priceKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                costKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                taxRateBps:
                  type: integer
                  minimum: 0
                  maximum: 10000
                attributes:
                  type: string
              required:
                - sku
                - name
                - priceKobo
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /v1/products/{id}/variants/{vid}:
    patch:
      summary: Update a product variant
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                priceKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                costKobo:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                taxRateBps:
                  nullable: true
                  type: integer
                  minimum: 0
                  maximum: 10000
